name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Android project archive
        run: |
          mkdir -p android-project
          base64 -d InkWashStudio_Android_MVP.zip.b64 > /tmp/inkwash.zip
          unzip -q /tmp/inkwash.zip -d android-project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Align Java and Kotlin JVM targets to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android-project")
          for path in list(root.rglob("*.gradle")) + list(root.rglob("*.gradle.kts")):
              text = path.read_text()
              updated = text
              updated = updated.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              updated = re.sub(r'(sourceCompatibility|targetCompatibility)\s*=\s*["\']1\.8["\']', r'\1 = "17"', updated)
              updated = re.sub(r'(jvmTarget\s*=\s*)["\']1\.8["\']', r'\1"17"', updated)
              if updated != text:
                  path.write_text(updated)
                  print(f"Updated JVM target in {path}")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InkWashStudio-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
