name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Android project archive
        run: |
          mkdir -p android-project
          base64 -d InkWashStudio_Android_MVP.zip.b64 > /tmp/inkwash.zip
          unzip -q /tmp/inkwash.zip -d android-project

      - name: Show Kotlin source around compiler errors
        run: |
          FILE=$(find android-project -name MainActivity.kt | head -n 1)
          echo "SOURCE FILE: $FILE"
          nl -ba "$FILE" | sed -n '45,175p'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Force Java compiler target to JVM 17
        run: |
          cat > /tmp/jvm17.init.gradle <<'EOF'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).all {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: gradle -I /tmp/jvm17.init.gradle -p android-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InkWashStudio-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
